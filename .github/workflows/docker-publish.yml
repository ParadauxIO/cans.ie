name: Tested digest release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    # Pin the public workflow library; private release tooling is pinned separately.
    uses: ParadauxIO/application-ci/.github/workflows/reusable-image.yaml@33f0dcb3f6f7a7eaad4671758f1af84e9614550d
    with:
      stack: node
      version: '22'
      test-command: npm ci && npm test
      image: harbor.paradaux.io/paradaux-public/cans
      publish: ${{ github.event_name != 'pull_request' }}
    secrets:
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
  promote:
    needs: image
    if: needs.image.outputs.digest != ''
    uses: ParadauxIO/application-ci/.github/workflows/reusable-promote.yaml@33f0dcb3f6f7a7eaad4671758f1af84e9614550d
    with:
      app: cans
      digest: ${{ needs.image.outputs.digest }}
      gitops-ref: 12e523b8fe732af208983ed92bb13c87bf05e870
    secrets:
      GITOPS_APP_CLIENT_ID: ${{ secrets.GITOPS_APP_CLIENT_ID }}
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
      DEVELOPMENT_KUBECONFIG: ${{ secrets.DEVELOPMENT_KUBECONFIG }}
